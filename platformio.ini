; WireClaw - ESP32 AI Agent
;
; Build:   pio run                    (builds default target: esp32-c6)
; Upload:  pio run -t upload
; Monitor: pio device monitor
; FS:      pio run -t uploadfs
;
; Other targets: pio run -e esp32-s3, pio run -e esp32, pio run -e esp32-c3

[platformio]
default_envs = esp32-c6

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
monitor_filters = colorize, time

[env:esp32-c6]
board = esp32-c6-devkitc-1
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

[env:esp32-s3]
board = esp32-s3-devkitc-1

[env:esp32-s3-nano-companion]
board = esp32-s3-devkitc-1
build_flags =
  -DWIRECLAW_SERIAL_TEXT_RX=19
  -DWIRECLAW_SERIAL_TEXT_TX=20
  -DCOMPANION_SPI_SCK=12
  -DCOMPANION_SPI_MISO=13
  -DCOMPANION_SPI_MOSI=11
  -DCOMPANION_CC1101_CS=5
  -DCOMPANION_CC1101_GDO0=4
  -DCOMPANION_SX1267_CS=6
  -DCOMPANION_SX1267_DIO1=8
  -DCOMPANION_SX1267_BUSY=10
  -DCOMPANION_SX1267_RST=9
  -DCOMPANION_NRF24_CSN=7
  -DCOMPANION_NRF24_CE=3
  -DCOMPANION_NRF24_IRQ=2
  -DCOMPANION_GPS_UART_TX=20
  -DCOMPANION_GPS_UART_RX=19
  -DCOMPANION_INTERBOARD_TX=16
  -DCOMPANION_INTERBOARD_RX=15

; Classic ESP32 not supported: DRAM overflow (~60KB over dram0_0_seg limit)
; due to large static buffers (LLM request, history, TLS). Use ESP32-C3 instead.
;[env:esp32]
;board = esp32dev

[env:esp32-c3]
board = esp32-c3-devkitm-1
